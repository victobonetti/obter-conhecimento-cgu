# Infra local da Ouvidoria Digital. Uso: docker compose up -d
# Redis, Keycloak e RabbitMQ entram aqui nas missões que pedirem (M3, M5, M6).
services:
  postgres:
    # 💡 PORQUÊ: pgvector já traz a extensão de vetores que o M7 (RAG) vai usar.
    #    Tag fixa (pg16): imagem "latest" muda sem aviso e quebra o ambiente.
    image: pgvector/pgvector:pg16
    container_name: ouvidoria-postgres
    restart: unless-stopped
    environment:
      # ⚠️ ATENÇÃO: valores vêm do .env (fora do git). Nada de senha no YAML.
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # "porta_do_host:porta_do_container". O Spring conecta em localhost:5432.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # ❓ PREVISÃO: o que acontece com os dados após "docker compose down"?
      #    E após "docker compose down -v"?
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # 💡 PORQUÊ: "container up" ≠ "banco aceitando conexão".
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # 💡 PORQUÊ: modo dev. Só o JDK; o código vem do bind mount e o Maven roda dentro.
    #    A imagem "de verdade" (Dockerfile multi-stage) é assunto do M8.
    image: eclipse-temurin:21-jdk
    container_name: ouvidoria-api
    working_dir: /app
    command: ./mvnw spring-boot:run
    volumes:
      - ./backend:/app
      # 💡 PORQUÊ: cache do Maven num volume. Sem ele, cada "up" baixa a internet de novo.
      - m2:/root/.m2
    ports:
      - "8080:8080"
    environment:
      # 🧩 COMPLETE: host e porta do banco VISTOS DE DENTRO da network do compose.
      SPRING_DATASOURCE_URL: jdbc:postgresql://???:???/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    # 🧩 COMPLETE: depends_on que espere o Postgres ficar HEALTHY, não só "started".
    # ❓ PREVISÃO: com um depends_on simples (lista com o nome do serviço), o que o
    #    Flyway faz se o Spring subir antes de o Postgres aceitar conexões?

volumes:
  pgdata:
  m2:
